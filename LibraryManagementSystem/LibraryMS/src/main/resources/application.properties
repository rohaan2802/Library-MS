# Application
spring.application.name=library-management

# Reversible password encryption (AES-256-GCM) — lab / admin view only; change for production & keep secret safe.
# Must be at least 16 characters. Same value must be used to decrypt existing rows.
app.security.password-secret=${APP_SECURITY_PASSWORD_SECRET:LibraryLab2026_ChangeThis_ToYourOwnLongRandomSecret_Key!}

# Optional: legacy only — if old rows used U1:-prefixed encrypted user ids, this key must match how they were created.
# app.security.user-id-secret=AnotherLongRandomSecret_OnlyForUserIds_32charsPlus!

# Profile picture uploads inside project folder (next to LibraryMS module)
app.upload.dir=${APP_UPLOAD_DIR:${user.dir}/../uploads/profile-pictures}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# MySQL — local defaults; override with env vars on Render/Aiven
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/library_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Admin1234}
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:10}

# Render/Railway set PORT. Local default stays 8081.
server.port=${PORT:8081}
server.forward-headers-strategy=framework
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:50}

# Auto logout after 15 minutes of inactivity (applies to all authenticated portals)
server.servlet.session.timeout=15m
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax

# Open the default browser when the app is ready (works in Eclipse, IntelliJ, VS Code, mvn spring-boot:run).
# Set to false for production, CI, or headless environments.
app.browser.open-on-start=${APP_BROWSER_OPEN_ON_START:true}

# Seed demo Admin/Librarian/Student + sample books when the users table is empty.
app.demo.seed=${APP_DEMO_SEED:false}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# No auto-generated in-memory user (we use custom authentication)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Thymeleaf
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# Do not expose exception messages, stack traces, or binding errors to clients (HTML or JSON error responses).
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Fine calculation
# Amount charged per overdue day (adjust to your library's currency/rate)
app.fine.per-day-rate=10.0

# Reservation / waitlist
# Hours a student has to pick up a book after being notified (READY status)
app.reservation.pickup-window-hours=96

# Admin maintenance
# Backup button writes exactly one file and replaces it on each run.
app.maintenance.backup.dir=${APP_BACKUP_DIR:${user.dir}/../DB_BackUP}
app.maintenance.backup.filename=library_db_backup.sql
# Comma-separated directories safe to clean on each maintenance run.
# Keep this list to non-critical temporary/cache folders only.
app.maintenance.cleanup.paths=${user.dir}/../tmp/library-management,${user.dir}/../tmp/library-management-cache
