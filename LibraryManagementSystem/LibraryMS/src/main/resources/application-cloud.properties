# Low-memory profile for free containers (SnapDeploy 512MB).
# Activated with SPRING_PROFILES_ACTIVE=cloud

spring.jmx.enabled=false
spring.thymeleaf.cache=true

spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=300000

server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2
server.tomcat.accept-count=20
server.tomcat.max-http-form-post-size=2MB
server.servlet.session.timeout=10m

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Live UI refresh interval (ms) — long enough so free RAM is not exhausted
app.live.poll-ms=15000

# mysqldump / mysql CLI are not in the cloud JRE image
app.maintenance.cli-tools-enabled=false

server.error.include-message=never
management.endpoint.health.show-details=never
